# Image server for mathisheck.de, deployed as a Dokploy "Compose" service.
#   images  – serves the photos publicly (domain e.g. images.mathisheck.de, port 80)
#   upload  – FileBrowser Quantum UI to upload/manage photos (domain e.g. upload.mathisheck.de, port 80)
#   indexer – publishes /_index.json + /_version and redeploys the website after changes
services:
  images:
    build: ./nginx
    restart: unless-stopped
    depends_on:
      - indexer
    volumes:
      - photos:/srv/photos:ro
    networks:
      - default
      - dokploy-network

  upload:
    build: ./filebrowser
    restart: unless-stopped
    # root so it can always write to the shared volume, whichever container created it
    user: "0:0"
    environment:
      # Login: user "admin" with this password (re-applied on every start)
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD:?set FILEBROWSER_ADMIN_PASSWORD in the Dokploy environment}
    volumes:
      - photos:/srv
      - filebrowser-data:/home/filebrowser/data
    networks:
      - default
      - dokploy-network

  indexer:
    build: ./indexer
    restart: unless-stopped
    environment:
      # Optional: redeploy the website automatically after uploads
      DOKPLOY_URL: ${DOKPLOY_URL:-}
      DOKPLOY_API_KEY: ${DOKPLOY_API_KEY:-}
      DOKPLOY_APPLICATION_ID: ${DOKPLOY_APPLICATION_ID:-}
      # Seconds without further changes before the redeploy is triggered
      QUIET_SECONDS: ${QUIET_SECONDS:-120}
    volumes:
      - photos:/srv/photos:ro
    networks:
      - default

volumes:
  photos:
  filebrowser-data:

networks:
  dokploy-network:
    external: true
