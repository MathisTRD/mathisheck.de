server {
	listen 80;
	server_name _;
	root /srv/photos;

	# Docker's DNS, so nginx starts even if the indexer is not up yet
	resolver 127.0.0.11 valid=30s ipv6=off;
	set $indexer http://indexer:8080;

	location = /_index.json {
		proxy_pass $indexer;
		add_header Cache-Control "no-store" always;
	}

	location = /_version {
		proxy_pass $indexer;
		add_header Cache-Control "no-store" always;
	}

	location ~ /\. {
		deny all;
	}

	location / {
		autoindex off;
		try_files $uri =404;
		add_header Cache-Control "public, max-age=300";
	}
}
